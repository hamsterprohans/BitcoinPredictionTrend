# Dependabot: memantau pembaruan keamanan aksi GitHub (dipin ke SHA) dan paket Python. Salin ke .github/dependabot.yml di akar repo.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/webapp"
    schedule:
      interval: "weekly"
