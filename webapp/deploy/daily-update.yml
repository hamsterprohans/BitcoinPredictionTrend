name: Pembaruan harian

on:
  schedule:
    # Banyak kesempatan per hari, padat sesaat setelah penutupan 00:00 UTC: GitHub sering menunda (berjam-jam) atau melewatkan jadwal. Job idempoten: bila data
    # hari itu sudah ada, ia langsung selesai. Penutupan harian UTC tersedia sejak 00:00 UTC.
    - cron: "17 0 * * *"
    - cron: "47 1 * * *"
    - cron: "17 3 * * *"
    - cron: "47 4 * * *"
    - cron: "17 6 * * *"
    - cron: "47 7 * * *"
    - cron: "17 9 * * *"
    - cron: "47 12 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pembaruan-harian
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/requirements.lock

      - name: Pasang dependensi
        run: pip install --require-hashes -r requirements.lock      # versi persis + hash: tak ada paket baru/berubah saat kunci API terpasang

      - name: Job harian (model, berita, sentimen)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINDESK_API_KEY: ${{ secrets.COINDESK_API_KEY }}
          ARTIFACTS_DIR: ${{ github.workspace }}/webapp/deploy_artifacts
          SEED_PRICE_TSV: ${{ github.workspace }}/webapp/deploy_artifacts/coin_metrics.tsv
        run: python -m app.jobs

      - name: Ekspor situs statis
        run: python -m scripts.export_static --base "/${{ github.event.repository.name }}" --out dist

      - name: Simpan keadaan terbaru (data/live)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "data: pembaruan harian $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - name: Publikasi ke gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webapp/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publikasi situs statis (otomatis)"
